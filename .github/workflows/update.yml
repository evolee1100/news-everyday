name: 更新新闻并部署

on:
  schedule:
    - cron: "0 */3 * * *"     # 每 3 小时抓一次（马来西亚时间 2、5、8、11 点…；高峰时段可能延迟几分钟）
  push:
    branches: [main]
  workflow_dispatch:          # 可在 Actions 页面手动点 Run

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 AI 翻译套件
        run: pip install --quiet anthropic
      # 翻译过的新闻存起来，下次只翻译新的，省钱
      - uses: actions/cache@v4
        with:
          path: data/translations.json
          key: translations-${{ github.run_id }}
          restore-keys: translations-
      - name: 抓取新闻 + 中文翻译
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 server.py --build
      - name: 准备网站文件
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/news.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
