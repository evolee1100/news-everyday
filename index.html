<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地球速报</title>
<style>
:root {
  --bg: #ffffff; --card: #ffffff; --ink: #1b1b1a; --muted: #6d6b66; --line: #e4e2dc;
  --accent: #c2410c; --accent-soft: #fdeee4; --my: #0f5f9c; --my-soft: #e5f0f9;
  --read: #a8a59e; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17.6px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px 64px; }

header { padding: 28px 0 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 30.8px; letter-spacing: .02em; }
h1 small { display: block; font-size: 15.4px; font-weight: 400; color: var(--muted); margin-top: 2px; letter-spacing: 0; }
.meta { font-size: 14.3px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 14.3px; }
.btn:hover { border-color: var(--muted); }
.btn[disabled] { opacity: .5; cursor: wait; }

nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 5px 14px; border-radius: 999px; font-size: 15.4px; }
.seg button.on { background: var(--ink); color: var(--bg); }
.seg.small button { padding: 4px 10px; font-size: 13.8px; }

.progress { margin: 18px 0 6px; display: flex; align-items: center; gap: 10px; font-size: 14.3px; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

h2 { font-size: 16.5px; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .tag { font-size: 13.2px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
h2 .tag.my { background: var(--my-soft); color: var(--my); }
h2 .hint { font-weight: 400; color: var(--muted); font-size: 13.8px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 12px; }
.num { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1.3; font-variant-numeric: tabular-nums; }
.card.my .num { color: var(--my); }
.body { min-width: 0; }
.title { font-size: 18.7px; font-weight: 650; line-height: 1.4; margin: 0; }
.title a:hover { text-decoration: underline; text-underline-offset: 3px; }
.sum { color: var(--muted); font-size: 15.4px; margin: 4px 0 0; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.orig { color: var(--muted); font-size: 13.8px; margin: 2px 0 0; font-style: italic; }
.ai { margin-left: 6px; font-size: 11.5px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; }
.foot { margin-top: 8px; font-size: 13.8px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.hot { color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 6px; font-weight: 600; }
.card.my .hot { color: var(--my); background: var(--my-soft); }
.more { border: 0; background: none; color: var(--muted); padding: 0; font-size: 13.8px; text-decoration: underline; text-underline-offset: 2px; }
.related { grid-column: 2 / -1; margin: 6px 0 0; padding: 8px 0 0; border-top: 1px dashed var(--line); font-size: 14.9px; list-style: none; display: none; }
.related.open { display: block; }
.related li { padding: 3px 0; }
.related b { font-weight: 600; color: var(--muted); font-size: 13.2px; margin-right: 6px; }
.thumb { width: 92px; height: 68px; border-radius: 9px; object-fit: cover; background: var(--line); }
.done { opacity: .55; border-style: dashed; }
.done .num, .done .title { color: var(--read); }
.check { border: 1.5px solid var(--muted); background: none; color: var(--ink); border-radius: 999px; font-size: 16px; font-weight: 600; padding: 6px 16px; min-height: 36px; margin-left: auto; }
.check:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.done .check { background: var(--line); border-color: var(--line); color: var(--muted); }

.empty, .err { text-align: center; color: var(--muted); padding: 40px 0; }
.allread { text-align: center; padding: 22px; margin-top: 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.allread strong { display: block; font-size: 19.8px; margin-bottom: 4px; }
footer { margin-top: 40px; font-size: 13.2px; color: var(--muted); line-height: 1.8; }
footer summary { cursor: pointer; }
.src-bad { color: var(--accent); }

@media (max-width: 560px) {
  h1 { font-size: 26.4px; }
  .card { grid-template-columns: 22px 1fr; padding: 12px 14px; }
  .thumb { display: none; }
  .title { font-size: 17.6px; }
  .num { font-size: 18.7px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>地球速报<small id="today"></small></h1>
    <div class="meta"><span id="updated">载入中…</span><button class="btn" id="refresh">刷新</button></div>
  </header>

  <nav>
    <div class="seg" id="view">
      <button data-v="brief" class="on">今日必知</button>
      <button data-v="world">国际</button>
      <button data-v="my">马来西亚</button>
    </div>
    <div class="seg small" id="lang">
      <button data-l="all" class="on">全部</button>
      <button data-l="zh">中文</button>
      <button data-l="en">English</button>
    </div>
  </nav>

  <main id="main"><p class="empty">正在收集全球头条…</p></main>

  <footer>
    排序方式：编辑放在越前面、越新、越多家媒体同时报道的新闻，排得越前。点标题去原文阅读。
    <details><summary>新闻来源状态</summary><div id="sources"></div></details>
  </footer>
</div>

<script>
const BRIEF_WORLD = 5, BRIEF_MY = 5;   // 今日必知：国际 / 大马 各几条
const FULL_MAX = 10;                   // 国际 / 马来西亚 分页最多几条
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let data = null;
let state = { view: store.get("view", "brief"), lang: store.get("lang", "all") };
let read = new Set(store.get("read", []));

$("#today").textContent = new Date().toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" }) + " · 国际 + 马来西亚头条";

function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return m + " 分钟前";
  const h = Math.round(m / 60);
  return h < 24 ? h + " 小时前" : Math.round(h / 24) + " 天前";
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// 有 AI 中文翻译的英文新闻，在「中文」里也算
const filt = arr => state.lang === "all" ? arr
  : state.lang === "zh" ? arr.filter(x => x.lang === "zh" || x.title_zh)
  : arr.filter(x => x.lang === "en");

function card(it, i, region) {
  const isRead = read.has(it.link);
  const zh = it.title_zh && state.lang !== "en";      // 用中文显示
  const title = zh ? it.title_zh : it.title;
  const sum = zh ? it.summary_zh : it.summary;
  const rel = it.related?.length
    ? `<button class="more" data-toggle>另有 ${it.related.length} 家报道 ▾</button>` : "";
  return `<article class="card ${region} ${isRead ? "done" : ""}" data-link="${esc(it.link)}">
    <div class="num">${i + 1}</div>
    <div class="body">
      <h3 class="title"><a href="${esc(it.link)}" target="_blank" rel="noopener" data-open>${esc(title)}</a></h3>
      ${zh ? `<p class="orig">${esc(it.title)}</p>` : ""}
      ${sum && sum !== title ? `<p class="sum">${esc(sum)}</p>` : ""}
      <div class="foot">
        ${it.sources > 1 ? `<span class="hot">🔥 ${it.sources} 家媒体</span>` : ""}
        <span>${esc(it.source)}${zh ? `<span class="ai">${it.tr === "ai" ? "AI 翻译" : "机器翻译"}</span>` : ""}</span><span>${ago(it.time)}</span>${rel}
        <button class="check" data-check>${isRead ? "已看 ✓" : "看过了"}</button>
      </div>
    </div>
    ${it.image ? `<img class="thumb" src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
    ${it.related?.length ? `<ul class="related">${it.related.map(r =>
      `<li><b>${esc(r.source)}</b><a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.title)}</a></li>`).join("")}</ul>` : ""}
  </article>`;
}

function section(title, cls, hint, items, region) {
  if (!items.length) return `<h2><span class="tag ${cls}">${title}</span></h2><p class="empty">这个语言暂时没有新闻</p>`;
  return `<h2><span class="tag ${cls}">${title}</span><span class="hint">${hint}</span></h2>
    <div class="list">${items.map((it, i) => card(it, i, region)).join("")}</div>`;
}

function render() {
  document.querySelectorAll("#view button").forEach(b => b.classList.toggle("on", b.dataset.v === state.view));
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === state.lang));
  if (!data) return;
  const W = filt(data.world), M = filt(data.my);
  let html = "";
  if (state.view === "brief") {
    const w = W.slice(0, BRIEF_WORLD), m = M.slice(0, BRIEF_MY);
    const all = [...w, ...m], seen = all.filter(x => read.has(x.link)).length;
    html += `<div class="progress"><span>今天 ${all.length} 条必知，约 ${Math.max(1, Math.round(all.length * 0.3))} 分钟</span>
      <div class="bar"><i style="width:${all.length ? seen / all.length * 100 : 0}%"></i></div><span>${seen}/${all.length}</span></div>`;
    html += section("🌍 国际", "", "全球最重要的事", w, "world");
    html += section("🇲🇾 马来西亚", "my", "本地最重要的事", m, "my");
    if (all.length && seen === all.length)
      html += `<div class="allread"><strong>今天的地球你已经掌握了 ✓</strong>想多看一点？切到「国际」或「马来西亚」看前 10 条。</div>`;
  } else if (state.view === "world") {
    html += section("🌍 国际头条", "", `最重要的 ${Math.min(W.length, FULL_MAX)} 条`, W.slice(0, FULL_MAX), "world");
  } else {
    html += section("🇲🇾 马来西亚头条", "my", `最重要的 ${Math.min(M.length, FULL_MAX)} 条`, M.slice(0, FULL_MAX), "my");
  }
  $("#main").innerHTML = html;
}

function markRead(link, on = true) {
  on ? read.add(link) : read.delete(link);
  // 只保留最近 400 条已读记录
  store.set("read", [...read].slice(-400));
  render();
}

$("#main").addEventListener("click", e => {
  const art = e.target.closest(".card"); if (!art) return;
  const link = art.dataset.link;
  if (e.target.closest("[data-toggle]")) {
    art.querySelector(".related").classList.toggle("open");
  } else if (e.target.closest("[data-check]")) {
    markRead(link, !read.has(link));
  } else if (e.target.closest("[data-open]")) {
    setTimeout(() => markRead(link), 300);
  }
});
$("#view").addEventListener("click", e => { const v = e.target.dataset.v; if (v) { state.view = v; store.set("view", v); render(); scrollTo({ top: 0 }); } });
$("#lang").addEventListener("click", e => { const l = e.target.dataset.l; if (l) { state.lang = l; store.set("lang", l); render(); } });

async function load(force) {
  const btn = $("#refresh"); btn.disabled = true; btn.textContent = "更新中…";
  try {
    let r = await fetch("/api/news" + (force ? "?refresh=1" : "")).catch(() => null);
    if (!r || !r.ok) r = await fetch("data/news.json?t=" + Date.now());   // 静态部署时的后备
    data = await r.json();
    $("#updated").textContent = "更新于 " + ago(data.updated);
    $("#sources").innerHTML = data.status.map(s =>
      `<div class="${s.ok ? "" : "src-bad"}">${s.ok ? "✓" : "✗"} ${esc(s.source)}（${s.region === "my" ? "大马" : "国际"}）${s.ok ? s.count + " 条" : esc(s.error)}</div>`).join("");
    render();
  } catch (e) {
    $("#main").innerHTML = `<p class="err">抓不到新闻：${esc(e.message)}<br>请确认是用 <code>python3 server.py</code> 打开的。</p>`;
  } finally { btn.disabled = false; btn.textContent = "刷新"; }
}
$("#refresh").addEventListener("click", () => load(true));
setInterval(() => { if (data) $("#updated").textContent = "更新于 " + ago(data.updated); }, 60000);
setInterval(() => load(false), 15 * 60000);   // 开着页面每 15 分钟自动更新
render(); load(false);
</script>
</body>
</html>
